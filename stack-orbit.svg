<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="54" y1="36" x2="1138" y2="548" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111D"/>
      <stop offset="0.58" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 280) rotate(90) scale(164 248)">
      <stop stop-color="#53D4FF" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#20C997" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coreStroke" x1="524" y1="218" x2="676" y2="342" gradientUnits="userSpaceOnUse">
      <stop stop-color="#53D4FF"/>
      <stop offset="1" stop-color="#FFB44D"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#53D4FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#20C997" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #F8FAFC; letter-spacing: 0.2px; }
      .subtitle { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #94A3B8; }
      .eyebrow { font: 700 11px 'Segoe UI', Arial, sans-serif; fill: #53D4FF; letter-spacing: 2.8px; }
      .coreLarge { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #F8FAFC; letter-spacing: 0.6px; }
      .coreSmall { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #94A3B8; letter-spacing: 2px; }
      .pillText { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #E2E8F0; }
      .pillRect { fill: rgba(8,17,29,0.86); stroke: rgba(148,163,184,0.24); stroke-width: 1; }
      .orbit { fill: none; stroke: rgba(148,163,184,0.17); stroke-width: 1.25; stroke-dasharray: 10 9; }
      .orbitAccent { fill: none; stroke: rgba(83,212,255,0.2); stroke-width: 1.1; stroke-dasharray: 24 18; }
      .vectorLine { stroke: rgba(83,212,255,0.18); stroke-width: 1.2; }
      .tiny { fill: #53D4FF; }
      .tinyWarm { fill: #FFB44D; }
      .tinyMint { fill: #20C997; }
    </style>
    <path id="innerOrbit" d="M 378 280 a 222 98 0 1 0 444 0 a 222 98 0 1 0 -444 0"/>
    <path id="outerOrbit" d="M 298 280 a 302 146 0 1 0 604 0 a 302 146 0 1 0 -604 0"/>
    <path id="vectorA" d="M 118 165 C 194 134 256 118 334 112"/>
    <path id="vectorB" d="M 864 444 C 930 424 1002 390 1074 336"/>
  </defs>

  <rect width="1200" height="560" rx="32" fill="url(#bg)"/>
  <ellipse cx="600" cy="280" rx="374" ry="174" fill="url(#coreGlow)" filter="url(#softGlow)"/>

  <g opacity="0.92">
    <ellipse class="orbit" cx="600" cy="280" rx="222" ry="98"/>
    <ellipse class="orbitAccent" cx="600" cy="280" rx="222" ry="98"/>
    <ellipse class="orbit" cx="600" cy="280" rx="302" ry="146"/>
    <ellipse class="orbitAccent" cx="600" cy="280" rx="302" ry="146"/>
  </g>

  <g>
    <path d="M 162 118 L 232 96" class="vectorLine"/>
    <path d="M 966 458 L 1036 422" class="vectorLine"/>
    <path d="M 148 392 L 236 424" class="vectorLine"/>
    <path d="M 984 124 L 1068 150" class="vectorLine"/>
    <path d="M 118 165 C 194 134 256 118 334 112" class="vectorLine"/>
    <path d="M 864 444 C 930 424 1002 390 1074 336" class="vectorLine"/>
  </g>

  <g>
    <circle cx="176" cy="116" r="2.6" class="tiny"/>
    <circle cx="1044" cy="146" r="2.4" class="tinyWarm"/>
    <circle cx="228" cy="424" r="2.3" class="tinyMint"/>
    <circle cx="964" cy="454" r="2.6" class="tiny"/>
    <circle cx="340" cy="92" r="1.8" class="tinyWarm"/>
    <circle cx="848" cy="472" r="1.8" class="tinyMint"/>
    <circle cx="176" cy="116" r="2.6" class="tiny">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="964" cy="454" r="2.6" class="tiny">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle r="4" fill="#53D4FF" filter="url(#softGlow)">
    <animateMotion dur="12s" repeatCount="indefinite">
      <mpath href="#vectorA"/>
    </animateMotion>
  </circle>

  <circle r="4" fill="#FFB44D" filter="url(#softGlow)">
    <animateMotion dur="10s" repeatCount="indefinite">
      <mpath href="#vectorB"/>
    </animateMotion>
  </circle>

  <g>
    <text x="600" y="82" text-anchor="middle" class="eyebrow">SYSTEM VIEW</text>
    <text x="600" y="118" text-anchor="middle" class="title">Tech Stack In Motion</text>
    <text x="600" y="145" text-anchor="middle" class="subtitle">What I reach for when building product systems, AI workflows, and internal tools</text>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="600" cy="280" r="88" fill="rgba(6,12,23,0.9)" stroke="url(#coreStroke)" stroke-width="1.6"/>
    <circle cx="600" cy="280" r="58" fill="rgba(15,23,42,0.9)" stroke="rgba(83,212,255,0.14)" stroke-width="1"/>
    <text x="600" y="266" text-anchor="middle" class="coreLarge">PRODUCT</text>
    <text x="600" y="296" text-anchor="middle" class="coreLarge">ENGINEER</text>
    <text x="600" y="323" text-anchor="middle" class="coreSmall">FULL STACK / AI / AUTOMATION</text>
  </g>

  <g filter="url(#cardShadow)">
    <g>
      <animateMotion dur="17s" begin="-0s" repeatCount="indefinite">
        <mpath href="#innerOrbit"/>
      </animateMotion>
      <rect x="-54" y="-18" width="108" height="36" rx="18" class="pillRect"/>
      <circle cx="-30" cy="0" r="4" fill="#53D4FF"/>
      <text x="10" y="5" text-anchor="middle" class="pillText">React</text>
    </g>
    <g>
      <animateMotion dur="17s" begin="-2.8s" repeatCount="indefinite">
        <mpath href="#innerOrbit"/>
      </animateMotion>
      <rect x="-60" y="-18" width="120" height="36" rx="18" class="pillRect"/>
      <circle cx="-34" cy="0" r="4" fill="#20C997"/>
      <text x="10" y="5" text-anchor="middle" class="pillText">Next.js</text>
    </g>
    <g>
      <animateMotion dur="17s" begin="-5.6s" repeatCount="indefinite">
        <mpath href="#innerOrbit"/>
      </animateMotion>
      <rect x="-74" y="-18" width="148" height="36" rx="18" class="pillRect"/>
      <circle cx="-46" cy="0" r="4" fill="#FFB44D"/>
      <text x="12" y="5" text-anchor="middle" class="pillText">TypeScript</text>
    </g>
    <g>
      <animateMotion dur="17s" begin="-8.4s" repeatCount="indefinite">
        <mpath href="#innerOrbit"/>
      </animateMotion>
      <rect x="-64" y="-18" width="128" height="36" rx="18" class="pillRect"/>
      <circle cx="-38" cy="0" r="4" fill="#53D4FF"/>
      <text x="12" y="5" text-anchor="middle" class="pillText">GraphQL</text>
    </g>
    <g>
      <animateMotion dur="17s" begin="-11.2s" repeatCount="indefinite">
        <mpath href="#innerOrbit"/>
      </animateMotion>
      <rect x="-56" y="-18" width="112" height="36" rx="18" class="pillRect"/>
      <circle cx="-32" cy="0" r="4" fill="#20C997"/>
      <text x="9" y="5" text-anchor="middle" class="pillText">Prisma</text>
    </g>
    <g>
      <animateMotion dur="17s" begin="-14s" repeatCount="indefinite">
        <mpath href="#innerOrbit"/>
      </animateMotion>
      <rect x="-60" y="-18" width="120" height="36" rx="18" class="pillRect"/>
      <circle cx="-34" cy="0" r="4" fill="#FFB44D"/>
      <text x="10" y="5" text-anchor="middle" class="pillText">Node.js</text>
    </g>
  </g>

  <g filter="url(#cardShadow)">
    <g>
      <animateMotion dur="28s" begin="-0s" repeatCount="indefinite">
        <mpath href="#outerOrbit"/>
      </animateMotion>
      <rect x="-80" y="-18" width="160" height="36" rx="18" class="pillRect"/>
      <circle cx="-52" cy="0" r="4" fill="#53D4FF"/>
      <text x="12" y="5" text-anchor="middle" class="pillText">PostgreSQL</text>
    </g>
    <g>
      <animateMotion dur="28s" begin="-4s" repeatCount="indefinite">
        <mpath href="#outerOrbit"/>
      </animateMotion>
      <rect x="-58" y="-18" width="116" height="36" rx="18" class="pillRect"/>
      <circle cx="-32" cy="0" r="4" fill="#20C997"/>
      <text x="10" y="5" text-anchor="middle" class="pillText">OpenAI</text>
    </g>
    <g>
      <animateMotion dur="28s" begin="-8s" repeatCount="indefinite">
        <mpath href="#outerOrbit"/>
      </animateMotion>
      <rect x="-72" y="-18" width="144" height="36" rx="18" class="pillRect"/>
      <circle cx="-44" cy="0" r="4" fill="#FFB44D"/>
      <text x="12" y="5" text-anchor="middle" class="pillText">LangChain</text>
    </g>
    <g>
      <animateMotion dur="28s" begin="-12s" repeatCount="indefinite">
        <mpath href="#outerOrbit"/>
      </animateMotion>
      <rect x="-56" y="-18" width="112" height="36" rx="18" class="pillRect"/>
      <circle cx="-32" cy="0" r="4" fill="#53D4FF"/>
      <text x="9" y="5" text-anchor="middle" class="pillText">Docker</text>
    </g>
    <g>
      <animateMotion dur="28s" begin="-16s" repeatCount="indefinite">
        <mpath href="#outerOrbit"/>
      </animateMotion>
      <rect x="-46" y="-18" width="92" height="36" rx="18" class="pillRect"/>
      <circle cx="-23" cy="0" r="4" fill="#20C997"/>
      <text x="8" y="5" text-anchor="middle" class="pillText">AWS</text>
    </g>
    <g>
      <animateMotion dur="28s" begin="-20s" repeatCount="indefinite">
        <mpath href="#outerOrbit"/>
      </animateMotion>
      <rect x="-82" y="-18" width="164" height="36" rx="18" class="pillRect"/>
      <circle cx="-54" cy="0" r="4" fill="#FFB44D"/>
      <text x="12" y="5" text-anchor="middle" class="pillText">Automation</text>
    </g>
    <g>
      <animateMotion dur="28s" begin="-24s" repeatCount="indefinite">
        <mpath href="#outerOrbit"/>
      </animateMotion>
      <rect x="-60" y="-18" width="120" height="36" rx="18" class="pillRect"/>
      <circle cx="-34" cy="0" r="4" fill="#53D4FF"/>
      <text x="10" y="5" text-anchor="middle" class="pillText">Postman</text>
    </g>
  </g>
</svg>
